<html lang="id">

<style>
/* Layout: satu kolom ramah HP untuk pekerja; master melebar dengan tabel bergulir sendiri */
:root{--bg:#f6f1e7;--fg:#2a1f16;--muted:#7a6a58;--card:#fffdf8;--line:#e4d8c4;--accent:#b23a1f;--ok:#2d7a4b;--warn:#9a6410;--bad:#b3261e;--bar:#c7553a;--info:#2f5f8a;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1510;--fg:#f1e9dc;--muted:#a69580;--card:#241d16;--line:#3a2f25;--accent:#e9785c;--ok:#72c592;--warn:#e6ad52;--bad:#f28b80;--bar:#d9694d;--info:#7fb2e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1510;--fg:#f1e9dc;--muted:#a69580;--card:#241d16;--line:#3a2f25;--accent:#e9785c;--ok:#72c592;--warn:#e6ad52;--bad:#f28b80;--bar:#d9694d;--info:#7fb2e0;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
.wrap.wide{max-width:1100px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}
h1{font-size:22px;margin:2px 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input[type=text],input[type=date],select,textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:4px}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
input[readonly]{background:var(--card);color:var(--muted);border-style:dashed}
button{font:inherit;cursor:pointer}
button.batch{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:50px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-align:left;font-variant-numeric:tabular-nums}
button.batch b{font-size:16px}
button.batch.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.s-macet{color:var(--bad);font-weight:600}.s-mulai{color:var(--warn)}.s-selesai{color:var(--ok)}.s-menunggu{color:var(--muted)}
.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px 12px;min-height:42px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.btn{padding:14px 6px;border:0;border-radius:10px;font-weight:600;color:#fff;min-height:50px}
.b-mulai{background:var(--warn)}.b-selesai{background:var(--ok)}.b-macet{background:var(--bad)}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px;border:1px solid var(--ok);color:var(--ok);background:var(--card)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted);font-size:14px;margin:0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px}
legend{font-size:13px;color:var(--muted);padding:0 4px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.tk{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;white-space:pre-wrap}
.tk h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.prev{font-size:13px;color:var(--muted);margin:0 0 12px}
.menu a{display:block;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;color:var(--fg);text-decoration:none;background:var(--card)}
.menu a span{display:block;font-size:13px;color:var(--muted)}
.foto img{max-width:160px;border-radius:8px;display:block;margin-top:6px}
/* Master */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.n,th.n{text-align:right}
td.wkt{font-size:12px;line-height:1.45}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.steps{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.steps i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.steps i.selesai{background:var(--ok)}.steps i.mulai{background:var(--warn)}.steps i.macet{background:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;font-size:13px}
.filters button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
svg text{fill:var(--muted);font-size:11px}
.small{font-size:12px;color:var(--muted)}
.sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 14px;font-size:14px}
.tabs button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.ghost{display:inline-flex;align-items:center;text-decoration:none}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 4px;font-size:14px;text-decoration:underline}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tgt{margin-bottom:14px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.invtot{display:grid;grid-template-columns:1fr auto;gap:4px 16px;justify-items:end;margin:8px 0;font-variant-numeric:tabular-nums}
.card.fu{margin-bottom:10px}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.login{max-width:440px;margin:0 auto}
.pin{letter-spacing:.3em;font-size:22px!important;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chips label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;background:var(--bg)}
h3.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center;margin-bottom:8px}
.srow input{margin-top:0}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55}
</style>

</head>
<body>
<div id="app" class="wrap"><p class="muted">Memuat…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===================== KONFIGURASI TAHAP =====================
const STAGES = {
  bersih: {
    label: "Pembersihan & Pengurusan Bahan Baku", short: "Bersih", prev: null, canCreate: false,
    // Perbandingan: 10.000 g bawang merah : 2.500 g cabe rawit : 300 g daun jeruk (rasio per 1 g bawang merah untuk cabe, dan per 1 kg untuk daun jeruk)
    ingredients: [
      {k: "bm", nama: "Bawang merah (bahan utama)", unit: "g", rasio: null},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: 0.25},
      {k: "dj", nama: "Daun jeruk", unit: "g", rasio: 30}
    ],
    verb: "dibersihkan", target: true,
    checks: []
  },
  rajang: {
    label: "Perajangan", short: "Rajang", prev: "bersih", canCreate: false,
    ingredients: [
      {k: "bm", nama: "Bawang merah (bahan utama)", unit: "g", rasio: null},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: null}
    ],
    // Tidak dirajang: beratnya diteruskan apa adanya dari tahap sebelumnya
    passthru: [{k: "dj", nama: "Daun jeruk", unit: "g"}],
    verb: "dirajang",
    checks: []
  },
  goreng: {
    label: "Penggorengan & Seasoning", short: "Goreng", prev: "rajang", canCreate: false,
    fields: [["berat_masuk", "Berat bahan masuk penggorengan (g)"], ["berat_goreng", "Berat setelah digoreng, sebelum seasoning (g)"], ["seasoning_g", "Bubuk seasoning dipakai (g) · otomatis"], ["paket_seasoning", "Paket seasoning disiapkan · otomatis"], ["berat_keluar", "Berat hasil setelah seasoning & dingin (g)"]],
    // 1 paket = 180 g bubuk campuran; dipakai 75 g per 1 kg bahan yang sudah digoreng
    seasoning: {perKg: 75, paketG: 180}, // angka bawaan; isi paket hanya disimpan di master data (khusus pemilik)
    checks: []
  },
  kemas: {
    label: "Pengemasan, QC, Labeling & Batch", short: "Kemas", prev: "goreng", canCreate: false,
    fields: [["berat_masuk", "Berat sambal siap kemas (g)"], ["jumlah_botol", "Jumlah botol · otomatis (dibulatkan ke bawah per 50 g)"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Botol reject (pcs)"]],
    perBotol: 50, perKardus: 20,
    checks: ["Tutup botol rapat, tidak bocor", "Isi per botol 50 g (cek timbang acak)", "Label & kode batch tercetak jelas", "Tanggal kedaluwarsa tercantum", "Tidak ada benda asing / warna menyimpang"],
    photo: true
  }
};
const ORDER = ["bersih", "rajang", "goreng", "kemas"];
Object.values(STAGES).forEach(C => { if (C.ingredients) C.fields = C.ingredients.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + C.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + C.verb + " (" + g.unit + ")"]]); });

// ===================== KONFIGURASI SAMBAL BASAH =====================
// Tahap basah memakai koleksi yang sama dengan tahap kering (posisi tahap sama), dibedakan oleh awalan nomor batch SB.
const STAGES_B = {
  bersih: {
    label: "Pembersihan bahan & topping", short: "Bersih", prev: null, canCreate: false, target: true,
    ingredients: [
      {k: "bm", nama: "Bawang merah", unit: "g", rasio: null},
      {k: "cb", nama: "Cabe besar", unit: "g", rasio: 1},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: 1},
      {k: "dj", nama: "Daun jeruk", unit: "g", rasio: 0.01}
    ],
    verb: "dibersihkan", checks: []
  },
  rajang: {
    label: "Penghalusan & pemasakan sampai 75%", short: "Halus", prev: "bersih",
    fields: [["berat_masuk", "Berat masuk (g) · otomatis dari tahap 1"], ["minyak_g", "Minyak goreng dipakai (g) · saran 1600 g (±2 liter) per 1 kg bawang merah"], ["berat_keluar", "Berat setelah dihaluskan dan dimasak 75% (g)"]],
    checks: []
  },
  goreng: {
    label: "Mixing topping & pemasakan sampai 100%", short: "Mix", prev: "rajang",
    fields: [["berat_masuk", "Berat masuk (g) · otomatis dari tahap 2"], ["topping_g", "Topping ditambahkan saat mixing (g) · saran 500 g per 1 kg hasil tahap 2 (teri 250 g)"], ["berat_keluar", "Berat setelah mixing dan dimasak 100% (g)"]],
    checks: []
  },
  kemas: {
    label: "Pengemasan, labeling & QC", short: "Kemas", prev: "goreng", canCreate: false,
    fields: [["berat_masuk", "Berat sambal siap kemas (g)"], ["jumlah_botol", "Jumlah botol · otomatis (dibulatkan ke bawah per 150 g)"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Botol reject (pcs)"]],
    perBotol: 150, perKardus: 20,
    checks: ["Tutup botol rapat, tidak bocor", "Isi per botol 150 g (cek timbang acak)", "Label & kode batch tercetak jelas", "Tanggal kedaluwarsa tercantum", "Tidak ada benda asing / warna menyimpang"],
    photo: true
  }
};
Object.values(STAGES_B).forEach(C => { if (C.ingredients) C.fields = C.ingredients.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + C.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + C.verb + " (" + g.unit + ")"]]); });
const jenisOf = id => (B[id] && B[id].jenis) === "basah" ? "basah" : "kering";
const VAR_LABEL = {cumi: "Cumi", tongkol: "Tongkol / tuna suwir", ayam: "Ayam suwir", udang: "Udang", teri: "Teri kering", polos: "Sambal bawang"};
// Varian yang dipilih di order (boleh lebih dari satu). Sisa sambal setelah porsi topping = sambal bawang.
const varsOf = id => (B[id] && Array.isArray(B[id].varians)) ? B[id].varians : (B[id] && B[id].varian && B[id].varian !== "polos" ? [B[id].varian] : []);
// Topping per 1 g sambal: cumi/tongkol/ayam/udang 500 g per 1000 g, teri 250 g per 1000 g
const topRatio = v => (v === "teri" ? (Number((TK.harga || {}).sb_teri_g_per_kg) || 250) : (Number((TK.harga || {}).sb_topping_g_per_kg) || 500)) / 1000;
function cfgBasah(id, v) {
  const base = STAGES_B[v], vs = varsOf(id);
  if (v === "bersih") {
    const ing = base.ingredients.concat(vs.map(x => ({k: "tp_" + x, nama: "Topping " + VAR_LABEL[x], unit: "g", rasio: null, topping: true})));
    return {...base, ingredients: ing, fields: ing.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + base.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + base.verb + (g.topping ? " · siap mixing" : "") + " (" + g.unit + ")"]])};
  }
  if (v === "goreng") return {...base, fields: [["berat_masuk", base.fields[0][1]], ...vs.flatMap(x => [["topping_" + x + "_g", "Topping " + VAR_LABEL[x] + " siap mixing (g) · dari tahap 1"], ["sambal_" + x + "_g", "Sambal " + VAR_LABEL[x] + " dimasukkan (g) · otomatis dari topping"], ["mix_" + x + "_g", "Berat setelah mixing " + VAR_LABEL[x] + " (g) · ditimbang"]]), ["sisa_g", "Sambal bawang tanpa topping (g) · otomatis = sisa"], ["berat_keluar", "Total berat setelah mixing (g) · otomatis"]]};
  if (v === "kemas") return {...base, fields: [["berat_masuk", base.fields[0][1]], ...vs.concat("polos").flatMap(x => [["botol_" + x, "Botol " + VAR_LABEL[x] + " · otomatis (per 150 g dari berat mixing)"], ["reject_" + x, "Reject " + VAR_LABEL[x] + " (pcs)"]]), ["jumlah_botol", "Jumlah botol total · otomatis"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Total reject · otomatis"]]};
  return base;
}
const cfgOf = (id, v = view) => (id && jenisOf(id) === "basah" ? cfgBasah(id, v) : STAGES[v]);
// Tahap 3 basah: topping siap mixing dari tahap 1; sambal = topping ÷ rasio; sisa = hasil tahap 2 − semua sambal.
// Setiap varian ditimbang sendiri setelah mixing; total = jumlah timbangan varian + sambal bawang.
function updMix() {
  if (!sel || view !== "goreng" || jenisOf(sel) !== "basah") return;
  const masuk = num($("#f_berat_masuk").value) || 0, P = R.bersih[sel] || {};
  let total = 0, mixSum = 0;
  varsOf(sel).forEach(v => {
    const t = P["tp_" + v + "_bersih"] ?? null, tEl = $("#f_topping_" + v + "_g"), sEl = $("#f_sambal_" + v + "_g");
    tEl.value = t ?? ""; tEl.readOnly = true;
    const sb = t == null ? null : Math.round(t / topRatio(v));
    sEl.value = sb ?? ""; sEl.readOnly = true;
    total += sb || 0;
    mixSum += num($("#f_mix_" + v + "_g").value) || 0;
  });
  const sisa = $("#f_sisa_g"); sisa.value = masuk ? Math.max(0, Math.round(masuk - total)) : ""; sisa.readOnly = true;
  const bk = $("#f_berat_keluar"); bk.value = (mixSum + (num(sisa.value) || 0)) || ""; bk.readOnly = true;
}
// Tahap 4 basah: botol per varian dari porsi + topping (sambal bawang dari sisa), dibagi 150 g
function updPacks() {
  if (!sel || view !== "kemas" || jenisOf(sel) !== "basah") return;
  const G = R.goreng[sel] || {};
  let tot = 0, rej = 0;
  varsOf(sel).concat("polos").forEach(v => {
    const w = v === "polos" ? (G.sisa_g || 0) : (G["mix_" + v + "_g"] || 0);
    const b = Math.floor(w / 150); tot += b;
    const el = $("#f_botol_" + v); el.value = b; el.readOnly = true;
    rej += num($("#f_reject_" + v).value) || 0;
  });
  ["f_jumlah_botol", "f_jumlah_label"].forEach(id => { const el = $("#" + id); el.value = tot; el.readOnly = true; });
  const rj = $("#f_reject"); rj.value = rej; rj.readOnly = true;
}

// ===================== UTIL =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Terima format Indonesia: "260.000" = 260000, "2,5" = 2.5, "1.250,75" = 1250.75
const num = v => {
  let s = String(v ?? "").trim().replace(/^rp\.?\s*/i, "").replace(/\s/g, "");
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "");
  s = s.replace(",", ".");
  const n = parseFloat(s); return isNaN(n) ? null : n;
};
const fmt = (n, d = 1) => n == null ? "–" : n.toLocaleString("id-ID", {maximumFractionDigits: d});
const hm = iso => iso ? new Date(iso).toLocaleString("id-ID", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Jakarta"}) : "";
function ddmm(d = new Date()) {
  const p = new Intl.DateTimeFormat("id-ID", {timeZone:"Asia/Jakarta", day:"2-digit", month:"2-digit"}).formatToParts(d);
  return p.find(x => x.type === "day").value + p.find(x => x.type === "month").value;
}
// Kode batch: SK (kering) / SB (basah) + tanggal 2 digit + huruf bulan (A=Jan … L=Des) + tahun 2 digit, lalu "-" nomor urut.
// Contoh: SK05K26-1 = sambal kering, 5 November 2026, batch pertama hari itu.
const BLN_KODE = "ABCDEFGHIJKL";
function kodeHari(prod = "SK", d = new Date()) {
  const p = new Intl.DateTimeFormat("id-ID", {timeZone: "Asia/Jakarta", day: "2-digit", month: "2-digit", year: "2-digit"}).formatToParts(d);
  const g = t => p.find(x => x.type === t).value;
  return prod + g("day") + BLN_KODE[Number(g("month")) - 1] + g("year");
}

function sortBatch(ids) {

async function createBatch() {
  if (!DB) return;
  if (!getName()) return say("Isi nama pekerja dulu.", true);
  const btn = $("#baru"); btn.disabled = true;
  const pre = kodeHari("SK");
  const used = Object.keys(B).filter(k => k.startsWith(pre + "-")).map(k => parseInt(k.slice(pre.length + 1), 10)).filter(n => !isNaN(n));
  let n = (used.length ? Math.max(...used) : 0) + 1;
  try {
    for (let i = 0; i < 5; i++, n++) {
      const id = pre + "-" + n;
      const ref = DB.doc("batches/" + id);
      if ((await ref.get()).exists) continue;
      await ref.set({id, tgl: pre, jenis: "kering", createdAt: new Date().toISOString(), oleh: getName()});
      sel = id; loadedFor = null;
      say("Batch " + id + " dibuat. Isi berat lalu tekan Mulai atau Selesai.");
      render(); return;
    }
    say("Gagal membuat nomor batch. Coba lagi.", true);
  } catch (e) { say(writeErr(e), true); }
  finally { btn.disabled = false; }
}

function writeErr(e) {
  if (e && e.code === "tidak_boleh") return "Anda tidak punya izin menyimpan di tahap ini. Minta pemilik mengatur tahap Anda.";
  if (e && e.code === "offline") return "Tidak ada sinyal. Data belum tersimpan, coba pencet lagi setelah sinyal kembali.";
  if (e && (e.code === "sesi_habis" || e.code === "belum_login")) return "Sesi berakhir. Silakan masuk lagi.";
  if (e && e.code === "masa_aktif_habis") return "Masa aktif aplikasi habis. Hubungi penjual untuk memperpanjang.";
  if (e && e.code === "quota_exceeded") return "Penyimpanan penuh. Hubungi pemilik.";
  return "Gagal menyimpan (" + (e && (e.code || e.message)) + "). Periksa sinyal lalu coba lagi.";
}

async function save(next) {
  if (!DB || !sel) return say("Pilih batch dulu.", true);
  const C = cfgOf(sel, view), oleh = getName();
  if (!oleh) return say("Isi nama pekerja dulu.", true);
  const prev = R[view][sel] || {}, now = new Date().toISOString();
  const body = {status: next, oleh, updatedAt: now, catatan: $("#catatan").value.trim(), mulaiAt: prev.mulaiAt || now, selesaiAt: null, checks: {}};
  if (prev.foto) body.foto = prev.foto;
  C.fields.forEach(([k]) => { body[k] = num($("#f_" + k).value); });
  C.checks.forEach((c, i) => { body.checks[c] = $("#c" + i).checked; });
  if (C.perBotol && body.jumlah_botol != null) {
    body.jumlah_kardus = Math.floor(body.jumlah_botol / C.perKardus);
    body.sisa_botol = body.jumlah_botol % C.perKardus;
    body.isi_per_botol_g = C.perBotol;
  }
  if (C.ingredients) {
    (C.passthru || []).forEach(g => { const p = (C.prev && R[C.prev][sel]) || {}; body[g.k + "_masuk"] = p[g.k + "_bersih"] ?? null; body[g.k + "_bersih"] = p[g.k + "_bersih"] ?? null; });
    const all = C.ingredients.filter(g => !g.topping).concat(C.passthru || []);

// ---------- HPP sambal basah: biaya batch dibagi per varian ----------
const BUMBU_BASAH = {"Terasi": "sb_terasi_g", "Garam": "sb_garam_g", "Micin": "sb_micin_g", "Gula pasir": "sb_gula_g"};
// Keterangan di daftar harga bumbu: dipakai produk mana
function pakaiBumbu(nm) {
  const l = String(nm).toLowerCase(), k = seasonCfg().paket.some(p => String(p[0]).toLowerCase() === l), b = Object.keys(BUMBU_BASAH).some(x => x.toLowerCase() === l);
  return k && b ? "dipakai sambal kering & basah" : k ? "khusus sambal kering" : b ? "khusus sambal basah" : "belum dipakai";
}
function hppBasah(id) {
  const H = TK.harga; if (!H || jenisOf(id) !== "basah" || !B[id]) return null;
  const n = k => Number(H[k]) || 0;
  const bb = nm => (H.bumbu || []).find(x => String(x.nama).trim().toLowerCase() === nm.toLowerCase()) || {};
  const bmR = R.bersih[id] || {}, gR = R.goreng[id] || {}, kR = R.kemas[id] || {};
  const bmKg = (bmR.bm_masuk ?? (B[id].order || {}).bm_kg ?? 0) / 1000;
  const vs = varsOf(id), all = vs.concat("polos");
  // Biaya bersama batch: bahan utama, minyak, bumbu, masako, gas, listrik, upah, biaya lain
  const bahan = (bmR.bm_masuk || 0) / 1000 * n("bm_kg") + (bmR.cb_masuk || 0) / 1000 * n("sb_cabe_besar_kg") + (bmR.cr_masuk || 0) / 1000 * n("cr_kg") + (bmR.dj_masuk || 0) / 1000 * n("dj_kg");
  // Minyak: pakai berat yang ditimbang di tahap 2 (gram) bila ada; kalau belum, perkiraan liter per kg bawang merah
  const minyakG = (R.rajang[id] || {}).minyak_g;
  const minyak = minyakG != null && n("minyak_isi_g") ? minyakG * n("minyak_harga") / n("minyak_isi_g") : bmKg * n("sb_minyak_l") * n("minyak_harga") / (n("minyak_isi_l") || 1);
  let bumbu = 0;
  Object.keys(BUMBU_BASAH).forEach(nm => { const b = bb(nm); if (b.harga && b.isi_g) bumbu += bmKg * n(BUMBU_BASAH[nm]) * b.harga / b.isi_g; });
  const masako = bmKg * n("sb_masako_per_kg") * n("sb_masako_rp");
  const gas = n("gas_harga") / (n("sb_gas_per_tabung") || 1);
  const listrik = n("sb_blender_w") * n("sb_blender_menit") / 60000 * n("listrik_kwh");
  const upah = n("upah_harian") * n("jumlah_pekerja") * (upahShare(id) ?? 1);
  const S = bahan + minyak + bumbu + masako + gas + listrik + upah + n("lain_per_batch");
  // Pembagian biaya bersama mengikuti berat setelah mixing tiap varian (sambal bawang = sisa)
  const berat = {}; vs.forEach(v => berat[v] = gR["mix_" + v + "_g"] || 0); berat.polos = gR.sisa_g || 0;
  const W = Object.values(berat).reduce((a, b) => a + b, 0);
  const varian = {};
  all.forEach(v => {
    const f = W ? berat[v] / W : 1 / all.length;
    // Topping dan kemasan dihitung langsung untuk varian itu
    const topping = v === "polos" ? 0 : (bmR["tp_" + v + "_bersih"] || 0) / 1000 * n("sb_topping_" + v + "_kg");
    const botol = kR["botol_" + v] || 0, reject = kR["reject_" + v] || 0, good = Math.max(0, botol - reject);
    const kemasan = botol * n("kemasan_per_botol"), kardus = Math.ceil(botol / 20) * n("kardus_harga");
    const total = S * f + topping + kemasan + kardus;
    varian[v] = {nama: PRODUK_LABEL[v], botol, reject, good, total, hpp: good ? total / good : null};
  });
  return {S, varian};
}
// HPP per botol tiap produk basah, dari semua batch yang sudah selesai dikemas
function hppProdukBasah() {
  const agg = {}; Object.keys(PRODUK_LABEL).forEach(k => agg[k] = {total: 0, good: 0});
  Object.keys(B).forEach(id => {
    const h = hppBasah(id); if (!h || !R.kemas[id] || R.kemas[id].status !== "selesai") return;
    Object.keys(h.varian).forEach(v => { const x = h.varian[v]; if (agg[v]) { agg[v].total += x.total; agg[v].good += x.good; } });
  });
  const out = {}; Object.keys(agg).forEach(k => out[k] = agg[k].good ? agg[k].total / agg[k].good : null); return out;
}

function renderChart(rows) {

function seasonCost(H) {

}

}

// ---------- Laporan per periode (harian, mingguan, bulanan, tahunan) ----------

function followRows() {
  const today = todayStr(), U = SET.usaha || {};
  const ambangDef = Number(U.ambang_restock) || 10, siklusDef = Number(U.siklus_cek) || 14;
  return Object.entries(P).map(([id, p]) => {
    const sales = Object.values(J).filter(v => v.pelangganId === id).sort((a, b) => (b.tgl || "").localeCompare(a.tgl || ""));
    const last = sales[0], siklus = Number(p.siklus) || siklusDef, ambang = Number(p.ambang) || ambangDef;
    if (!last) return {id, p, level: 3, txt: "Belum pernah ada pengiriman", next: "9999"};
    const lastQty = invBotol(last), cek = p.cek && p.cek.tgl >= last.tgl ? p.cek : null;
    const next = addDays(cek ? cek.tgl : last.tgl, siklus);
    let level, txt;
    if (cek && cek.sisa != null && cek.sisa <= ambang) { level = 0; txt = `Perlu kirim ulang · sisa ${fmt(cek.sisa, 0)} botol saat dicek ${tglID(cek.tgl)}`; }
    else if (today >= next) { level = 1; txt = `Waktunya cek stok${today > next ? ` · terlambat ${daysBetween(next, today)} hari` : " hari ini"}`; }
    else { level = 2; txt = `Aman · cek lagi ${tglID(next)}${cek ? ` (sisa ${fmt(cek.sisa, 0)} botol saat dicek)` : ""}`; }
    let laju = null;
    if (cek && cek.sisa != null) { const d = daysBetween(last.tgl, cek.tgl); if (d > 0) laju = Math.max(0, (lastQty - cek.sisa) / d * 7); }
    return {id, p, last, lastQty, next, level, txt, laju};
  }).sort((a, b) => a.level - b.level || String(a.next).localeCompare(String(b.next)));
}

function invText(v) {
  const U = SET.usaha || {}, pel = v.pel || {};
  const lines = (v.items || []).map(it => `- ${it.nama}: ${fmt(it.botol, 0)} botol x ${rp(it.harga)} = ${rp(it.botol * it.harga)}`);
  const out = [`*INVOICE ${v.no}*`, U.nama || "", `Tanggal: ${tglID(v.tgl)}`, `Kepada: ${pel.nama || ""}`, "", ...lines, "", `Subtotal: ${rp(v.subtotal)}`];
  if (v.diskon) out.push(`Diskon: -${rp(v.diskon)}`);
  if (v.ongkir) out.push(`Ongkos kirim: ${rp(v.ongkir)}`);

  return out.filter((l, i) => !(l === "" && i === 1)).join("\n");
}

// Kirim PDF lewat menu berbagi HP (WhatsApp bisa dipilih di sana). Cadangan: simpan PDF lalu buka WA dengan teks.

async function savePdf(v, opts) {
  if (!window.jspdf) return say("Pembuat PDF belum termuat. Periksa sinyal, lalu muat ulang halaman.", true);
  if (!DL) return say("Simpan file tidak tersedia di browser ini.", true);
  const U = SET.usaha || {}, pel = v.pel || {}, perK = STAGES.kemas.perKardus;
  const doc = new window.jspdf.jsPDF({unit: "mm", format: "a5"});
  const L = 12, Rx = 136; let y = 14;
  const t = (s, x, yy, o) => doc.text(String(s ?? ""), x, yy, o || {});
  doc.setFont("helvetica", "bold"); doc.setFontSize(13); t(U.nama || "Nama usaha", L, y);
  doc.setFontSize(15); t("INVOICE", Rx, y, {align: "right"});
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
  let yl = y + 5; doc.splitTextToSize(U.alamat || "", 80).forEach(s => { t(s, L, yl); yl += 4; }); if (U.telp) { t(U.telp, L, yl); yl += 4; }
  t(v.no, Rx, y + 5, {align: "right"}); t(tglID(v.tgl), Rx, y + 9, {align: "right"});
  y = Math.max(yl, y + 13) + 3; doc.setDrawColor(200); doc.line(L, y, Rx, y); y += 6;
  doc.setFontSize(8); doc.setTextColor(110); t("Kepada", L, y); doc.setTextColor(0); y += 5;
  doc.setFont("helvetica", "bold"); doc.setFontSize(10); t(pel.nama, L, y); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); y += 4.5;
  if (pel.telp) { t(pel.telp, L, y); y += 4; }
  doc.splitTextToSize(pel.alamat || "", 120).forEach(s => { t(s, L, y); y += 4; });
  y += 4;
  doc.setFillColor(240, 236, 228); doc.rect(L, y - 4.5, Rx - L, 7, "F"); doc.setFont("helvetica", "bold");
  t("Barang", L + 1, y); t("Botol", 86, y, {align: "right"}); t("Dus", 99, y, {align: "right"}); t("Harga", 117, y, {align: "right"}); t("Jumlah", Rx - 1, y, {align: "right"});
  doc.setFont("helvetica", "normal"); y += 7;
  (v.items || []).forEach(it => {
    const nm = doc.splitTextToSize(it.nama, 58);
    nm.forEach((s, i) => t(s, L + 1, y + i * 4));
    t(fmt(it.botol, 0), 86, y, {align: "right"}); t(fmt(it.botol / perK, 1), 99, y, {align: "right"}); t(rp(it.harga), 117, y, {align: "right"}); t(rp(it.botol * it.harga), Rx - 1, y, {align: "right"});
    y += Math.max(1, nm.length) * 4 + 3; doc.setDrawColor(225); doc.line(L, y - 3, Rx, y - 3);
  });
  y += 2;
  const tot = (l, val, bold) => { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(bold ? 10.5 : 8.5); t(l, 100, y, {align: "right"}); t(val, Rx - 1, y, {align: "right"}); y += bold ? 7 : 4.5; };
  tot("Subtotal", rp(v.subtotal)); if (v.diskon) tot("Diskon", "- " + rp(v.diskon)); if (v.ongkir) tot("Ongkos kirim", rp(v.ongkir)); tot("Total", rp(v.total), true);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10);
  if (v.status === "lunas") doc.setTextColor(45, 122, 75); else doc.setTextColor(179, 38, 30);
  t(v.status === "lunas" ? "LUNAS" : "BELUM LUNAS", L, y); doc.setTextColor(0); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
  const block = s => { doc.splitTextToSize(s, Rx - L).forEach(line => { if (y > 200) { doc.addPage(); y = 14; } t(line, L, y); y += 4; }); y += 2; };
  if (U.rekening) block("Pembayaran:\n" + U.rekening);
  if (U.qris) { if (y > 160) { doc.addPage(); y = 14; } try { doc.addImage(U.qris, "JPEG", L, y, 34, 34); y += 37; } catch (e) {} }
  if (v.catatan) block(v.catatan);
  if (U.catatan_invoice) block(U.catatan_invoice);
  if (opts && opts.wa) return kirimPdfWA(v, doc.output("blob"), `${v.no} ${String(pel.nama || "").replace(/[^\w\s-]/g, "").trim()}.pdf`);
  try { await DL.save({filename: `${v.no} ${String(pel.nama || "").replace(/[^\w\s-]/g, "").trim()}.pdf`, data: doc.output("blob")}); say("PDF invoice tersimpan."); }
  catch (err) { if (err && err.code === "declined") return; say("PDF tidak tersimpan (" + (err && err.code) + ").", true); }
}

let QRIS_BARU; // undefined = tidak diubah, null = dihapus, string = gambar baru (data URL)
function kecilkanGambar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("gambar")); };
    img.src = url;
  });
}

    } catch (e) { say(writeErr(e), true); }
  };
}

// ===================== AKSES SERVER (Supabase Edge Function sambal-api) =====================
function err(code, message, status) { const e = new Error(message || code); e.code = code; e.status = status; return e; }
async function api(op, payload) {
  const h = {"content-type": "application/json", apikey: CONFIG.SUPABASE_KEY};
  if (SESI) h["x-sesi"] = SESI;
  else if (SB) { const {data} = await SB.auth.getSession(); if (data.session) h.authorization = "Bearer " + data.session.access_token; }
  let r;
  try { r = await fetch(CONFIG.SUPABASE_URL + "/functions/v1/sambal-api", {method: "POST", headers: h, body: JSON.stringify({op, ...(payload || {})})}); }
  catch (e) { throw err("offline", "Tidak ada sinyal"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = err(j.error || "http_" + r.status, j.message || j.error, r.status);
    if (AUTH.role && (r.status === 401 || r.status === 402 || r.status === 403) && op !== "pin_login") sesiBerakhir(e.code);
    throw e;
  }
  return j;
}
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Penyimpanan dengan bentuk yang sama seperti versi artifact: collection().onSnapshot / doc().get/set/update/delete.
// Data diperbarui otomatis tiap 15 detik (60 detik saat layar tidak aktif) dan langsung setelah menyimpan.
function makeDb() {
  const subs = {};
  let timer = null, pending = null, lastErr = null;
  async function poll() {
    const colls = Object.keys(subs); if (!colls.length || !AUTH.role) return;
    try {
      const j = await api("list", {colls});
      colls.forEach(c => {
        const o = (j.docs || {})[c] || {};
        const docs = Object.keys(o).map(id => ({id, exists: true, data: () => o[id]}));
        subs[c].forEach(cb => cb({docs, size: docs.length, empty: !docs.length}));
      });
      if (lastErr) { lastErr = null; if (msgBad) say("", false); }
    } catch (e) { if (e.code === "offline" && !lastErr) { lastErr = e; say("Tidak ada sinyal. Data akan diperbarui lagi saat sinyal kembali.", true); } }
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(async () => { await poll(); schedule(); }, document.hidden ? 60000 : 15000); }
  function refresh() { if (pending) return; pending = setTimeout(async () => { pending = null; await poll(); schedule(); }, 60); }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  const doc = path => {
    const k = path.indexOf("/"), coll = path.slice(0, k), id = path.slice(k + 1);
    return {
      id, path,
      get: async () => { const j = await api("get", {coll, id}); return {id, exists: !!j.exists, data: () => j.data}; },
      set: async d => { await api("set", {coll, id, data: d}); refresh(); },
      update: async d => { await api("update", {coll, id, data: d}); refresh(); },
      delete: async () => { await api("delete", {coll, id}); refresh(); }
    };
  };
  return {
    doc, refresh,
    collection: c => ({
      onSnapshot: next => { (subs[c] = subs[c] || []).push(next); refresh(); return () => {}; },
      doc: id => doc(c + "/" + (id || rid())),
      add: async d => { const ref = doc(c + "/" + rid()); await ref.set(d); return ref; }
    })
  };
}

// Simpan file langsung ke HP/laptop (PDF invoice, Excel laporan)
const LOCAL_DL = {save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return {status: "saved"};
}};

// ===================== PERAN & LOGIN =====================
function bolehTahap(k) { if (AUTH.role !== "worker") return true; const t = AUTH.info.tahap || []; return !t.length || t.includes(k); }
function topbar() {
  const who = AUTH.role === "owner" ? "Pemilik" : esc(AUTH.info.nama || "Pekerja");
  return `<div class="topbar"><span>${esc(AUTH.info.usaha.nama)} · ${who}</span><button type="button" class="linkbtn" data-logout="1">Keluar</button></div>`;
}
document.addEventListener("click", e => { if (e.target.closest("[data-logout]")) keluar(); });
function shellTolak() {
  $("#app").className = "wrap";

}
function waLink0(msg) { return CONFIG.SUPPORT_WA ? `https://wa.me/${CONFIG.SUPPORT_WA}?text=${encodeURIComponent(msg)}` : ""; }
function shellLogin(h) {
  const app = $("#app"); app.className = "wrap";

  try { if (h && h !== "login") sessionStorage.setItem("tujuan", h); } catch (e) {}
  const owner = `<div class="card" id="cOwner"><h2>Masuk sebagai pemilik</h2>
      <p class="small" style="margin:0 0 8px">Pakai email yang Anda gunakan saat membeli aplikasi. Link masuk dikirim ke email itu.</p>
      <label class="fld">Email<input id="lEmail" type="email" inputmode="email" autocomplete="email"></label>
      <button id="lEmailBtn" class="btn b-selesai" type="button" style="width:100%">Kirim link masuk</button>
      <div id="lEmailMsg" style="margin-top:10px"></div></div>`;
  const worker = `<div class="card" id="cWorker"><h2>Masuk sebagai pekerja</h2>
      <p class="small" style="margin:0 0 8px">Minta kode usaha dan PIN Anda ke pemilik.</p>
      <label class="fld">Kode usaha<input id="lKode" type="text" autocapitalize="characters" autocomplete="off" maxlength="12" style="text-transform:uppercase"></label>
      <label class="fld">PIN<input id="lPin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>
      <button id="lPinBtn" class="btn b-selesai" type="button" style="width:100%">Masuk</button>
      <div id="lPinMsg" style="margin-top:10px"></div></div>`;
  app.innerHTML = `<div class="login"><p class="eyebrow">Aplikasi Batch Sambal</p><h1>Masuk</h1>${pekerjaDulu ? worker + owner : owner + worker}
    <p class="small">Belum punya aplikasinya? <a href="${esc(CONFIG.BUY_URL)}" target="_blank" rel="noopener">Beli akses di sini</a>.</p></div>`;
  try { $("#lKode").value = localStorage.getItem("kode_usaha") || ""; } catch (e) {}
  $("#lEmailBtn").onclick = kirimLink;
  $("#lPinBtn").onclick = masukPin;
  $("#lPin").addEventListener("keydown", e => { if (e.key === "Enter") masukPin(); });
}
async function kirimLink() {
  const email = $("#lEmail").value.trim().toLowerCase(), box = $("#lEmailMsg"), btn = $("#lEmailBtn");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { box.innerHTML = '<p class="msg bad">Isi email dengan benar.</p>'; return; }
  btn.disabled = true; box.innerHTML = '<p class="small">Memeriksa…</p>';
  try {
    const c = await api("cek_pembeli", {email});
    if (!c.terdaftar) {
      const wa = waLink0("Halo, saya mau tanya akses Aplikasi Batch Sambal untuk email " + email);
      box.innerHTML = `<p class="msg bad">Email ini belum terdaftar sebagai pembeli.</p><div class="acts"><a class="ghost" href="${esc(CONFIG.BUY_URL)}" target="_blank" rel="noopener">Beli akses</a>${wa ? `<a class="ghost" href="${esc(wa)}" target="_blank" rel="noopener">Tanya lewat WA</a>` : ""}</div>`;
      btn.disabled = false; return;
    }
    const {error} = await SB.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true}});
    if (error) throw err("auth", error.message);
    box.innerHTML = `<p class="msg">Link masuk sudah dikirim ke ${esc(email)}. Buka email itu lalu pencet linknya. Cek folder Spam/Promosi kalau belum masuk.</p>`;
  } catch (e) {
    box.innerHTML = `<p class="msg bad">${e.code === "offline" ? "Tidak ada sinyal. Coba lagi." : /rate|seconds/i.test(e.message || "") ? "Terlalu sering meminta link. Tunggu beberapa menit lalu coba lagi." : "Gagal mengirim link (" + esc(e.message || e.code) + ")."}</p>`;
  }
  btn.disabled = false;
}
async function masukPin() {
  const kode = $("#lKode").value.trim().toUpperCase(), pin = $("#lPin").value.trim(), box = $("#lPinMsg"), btn = $("#lPinBtn");
  if (!kode || !/^\d{4,8}$/.test(pin)) { box.innerHTML = '<p class="msg bad">Isi kode usaha dan PIN (4–8 angka).</p>'; return; }
  btn.disabled = true; box.innerHTML = '<p class="small">Memeriksa…</p>';
  try {
    const j = await api("pin_login", {kode, pin});
    SESI = j.token;
    try { localStorage.setItem("sm_sesi", j.token); localStorage.setItem("kode_usaha", kode); } catch (e) {}
    await mulaiSesi();
  } catch (e) {
    const t = {kode_atau_pin_salah: "Kode usaha atau PIN salah.", terkunci: "Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.", masa_aktif_habis: "Masa aktif aplikasi usaha ini sudah habis. Hubungi pemilik.", offline: "Tidak ada sinyal. Coba lagi."}[e.code] || "Gagal masuk (" + esc(e.code) + ").";
    box.innerHTML = `<p class="msg bad">${t}</p>`;
  }
  btn.disabled = false;
}
let sesiSudahBerakhir = false;
function sesiBerakhir(code) {
  if (sesiSudahBerakhir) return; sesiSudahBerakhir = true;
  const pesan = code === "masa_aktif_habis" ? "Masa aktif aplikasi habis. Hubungi penjual untuk memperpanjang." : code === "bukan_pembeli" ? "Email ini belum terdaftar sebagai pembeli aplikasi." : "Sesi berakhir. Silakan masuk lagi.";
  keluar(pesan);
}
async function keluar(pesan) {
  try { if (SESI) await api("logout"); } catch (e) {}
  SESI = null; try { localStorage.removeItem("sm_sesi"); } catch (e) {}
  try { if (SB) await SB.auth.signOut(); } catch (e) {}
  if (pesan) try { sessionStorage.setItem("pesan_login", pesan); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
  location.reload();
}

// ===================== KELOLA PEKERJA (pemilik) =====================
let PEK = [], pekEdit = null, pekDel = null;
async function muatPekerja() { try { PEK = (await api("pekerja_list")).pekerja || []; } catch (e) { PEK = []; } drawPekerja(); }
function renderPekerja() {
  const box = $("#pekerjaCard"); if (!box) return;
  if (!IS_ADMIN) { box.hidden = true; return; }
  if (box.dataset.built) return;
  box.dataset.built = "1";
  muatPekerja();
}
function drawPekerja() {
  const box = $("#pekerjaCard"); if (!box) return;
  const p = (pekEdit && PEK.find(x => x.id === pekEdit)) || {};
  const link = location.origin + location.pathname;
  box.innerHTML = `<div class="row"><h2 style="margin:0">Pekerja & PIN</h2><span class="small">Kode usaha: <b style="font-size:16px;letter-spacing:.08em">${esc(AUTH.info.usaha.kode || "")}</b></span></div>
    <p class="small" style="margin:0 0 10px">Pekerja membuka <b>${esc(link)}</b>, pilih "Masuk sebagai pekerja", lalu isi kode usaha dan PIN. Setiap pekerja punya PIN sendiri, jadi namanya otomatis tercatat di setiap tahap.</p>
    ${PEK.length ? PEK.map(x => `<div class="row" style="margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:8px"><span><b>${esc(x.nama)}</b>${x.aktif ? "" : ' <span class="small">(nonaktif)</span>'}<br><span class="small">${x.tahap && x.tahap.length ? x.tahap.map(t => esc(STAGES[t] ? STAGES[t].short : t)).join(", ") : "Semua tahap"}</span></span>
      <span class="acts"><button type="button" class="ghost" data-pke="${esc(x.id)}">Ubah</button><button type="button" class="linkbtn" data-pkd="${esc(x.id)}">${pekDel === x.id ? "Yakin hapus? Pencet lagi" : "Hapus"}</button></span></div>`).join("") : '<p class="muted" style="margin-bottom:10px">Belum ada pekerja.</p>'}
    <fieldset><legend><b>${pekEdit ? "Ubah pekerja" : "Tambah pekerja"}</b></legend>
      <label class="fld">Nama<input id="pkNama" type="text" value="${esc(p.nama || "")}"></label>
      <label class="fld">PIN 4–8 angka${pekEdit ? " · kosongkan kalau tidak diganti" : ""}<input id="pkPin" class="pin" type="text" inputmode="numeric" maxlength="8" autocomplete="off"></label>
      <div class="small">Tahap yang boleh dikerjakan (tidak dicentang semua = semua tahap)</div>
      <div class="chips">${ORDER.map(k => `<label><input type="checkbox" value="${k}" class="pkT" ${(p.tahap || []).includes(k) ? "checked" : ""}> ${esc(STAGES[k].short)}</label>`).join("")}</div>
      ${pekEdit ? `<label class="chk"><input type="checkbox" id="pkAktif" ${p.aktif === false ? "" : "checked"}> Aktif (boleh masuk)</label>` : ""}
      <div class="acts"><button id="pkSave" class="ghost" type="button">${pekEdit ? "Simpan perubahan" : "Tambah pekerja"}</button>${pekEdit ? '<button id="pkBatal" class="linkbtn" type="button">Batal</button>' : ""}</div>
    </fieldset>`;
  box.onclick = async e => {
    const ed = e.target.closest("[data-pke]"); if (ed) { pekEdit = ed.dataset.pke; pekDel = null; drawPekerja(); return; }
    const dl = e.target.closest("[data-pkd]");
    if (dl) {
      if (pekDel !== dl.dataset.pkd) { pekDel = dl.dataset.pkd; drawPekerja(); return; }
      try { await api("pekerja_delete", {id: dl.dataset.pkd}); pekDel = null; say("Pekerja dihapus."); muatPekerja(); } catch (er) { say(writeErr(er), true); }
    }
  };
  $("#pkSave").onclick = async () => {
    const nama = $("#pkNama").value.trim(), pin = $("#pkPin").value.trim();
    if (!nama) return say("Isi nama pekerja.", true);
    if (!pekEdit && !/^\d{4,8}$/.test(pin)) return say("Isi PIN 4–8 angka.", true);
    if (pin && !/^\d{4,8}$/.test(pin)) return say("PIN harus 4–8 angka.", true);
    const tahap = [...document.querySelectorAll(".pkT:checked")].map(x => x.value);
    try {
      await api("pekerja_save", {id: pekEdit || undefined, nama, pin: pin || undefined, tahap, aktif: pekEdit ? $("#pkAktif").checked : true});
      say(pekEdit ? "Data pekerja diperbarui." : `${nama} ditambahkan. Beri tahu dia kode usaha ${AUTH.info.usaha.kode} dan PIN-nya.`);
      pekEdit = null; muatPekerja();
    } catch (er) { say(er.code === "pin_dipakai" ? "PIN ini sudah dipakai pekerja lain. Pilih PIN lain." : writeErr(er), true); }
  };
  if (pekEdit) $("#pkBatal").onclick = () => { pekEdit = null; drawPekerja(); };
}

// ===================== MULAI =====================
async function mulaiSesi() {
  let w;
  try { w = await api("whoami"); }
  catch (e) {
    if (SESI) { SESI = null; try { localStorage.removeItem("sm_sesi"); } catch (x) {} }
    if (e.code === "bukan_pembeli") { try { await SB.auth.signOut(); } catch (x) {} AUTH.ready = true; route(); $("#lEmailMsg") && ($("#lEmailMsg").innerHTML = '<p class="msg bad">Email ini belum terdaftar sebagai pembeli aplikasi.</p>'); return; }
    if (e.code === "masa_aktif_habis") { AUTH.ready = true; route(); say("Masa aktif aplikasi habis.", true); return; }
    if (e.code === "offline") { $("#app").innerHTML = '<h1>Tidak ada sinyal</h1><p class="muted">Sambungkan internet lalu muat ulang halaman.</p>'; return; }
    AUTH.ready = true; route(); return;
  }
  AUTH = {role: w.role, info: w, ready: true};
  IS_ADMIN = w.role === "owner"; OWNER_KNOWN = true;
  DB = makeDb(); DL = LOCAL_DL;
  const db = DB;
  db.collection("batches").onSnapshot(s => { B = {}; s.docs.forEach(d => B[d.id] = d.data() || {}); ready = true; render(); });
  ORDER.forEach(k => db.collection(k).onSnapshot(s => { R[k] = {}; s.docs.forEach(d => R[k][d.id] = d.data() || {}); render(); }));
  db.collection("takaran").onSnapshot(s => { TK = {}; s.docs.forEach(d => TK[d.id] = d.data() || {}); render(); });
  if (IS_ADMIN) {
    db.collection("pelanggan").onSnapshot(s => { P = {}; s.docs.forEach(d => P[d.id] = d.data() || {}); if (view === "penjualan" && stab === "baru" && $("#ivPel") && !$("#ivPel").options.length) $("#sbody").dataset.tab = ""; render(); });
    db.collection("penjualan").onSnapshot(s => { J = {}; s.docs.forEach(d => J[d.id] = d.data() || {}); render(); });
    db.collection("setting").onSnapshot(s => { SET = {}; s.docs.forEach(d => SET[d.id] = d.data() || {}); if (view === "penjualan" && stab === "atur" && $("#sbody") && !$("#sbody").contains(document.activeElement)) $("#sbody").dataset.tab = ""; render(); });
  }
  let tujuan = ""; try { tujuan = sessionStorage.getItem("tujuan") || ""; sessionStorage.removeItem("tujuan"); } catch (e) {}
  const h = (location.hash || "").replace("#", "");
  if ((!h || h.includes("access_token")) && tujuan) { history.replaceState(null, "", location.pathname + location.search + "#" + tujuan); }
  else if (h.includes("access_token") || h.includes("error=")) history.replaceState(null, "", location.pathname + location.search + (IS_ADMIN ? "#master" : ""));
  route();
}
async function init() {
  route();
  if (!window.supabase) { $("#app").innerHTML = '<h1>Gagal memuat aplikasi</h1><p class="muted">Periksa sinyal internet lalu muat ulang halaman.</p>'; return; }
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit"}});
  try { SESI = localStorage.getItem("sm_sesi") || null; } catch (e) {}
  if (!SESI) {
    const {data} = await SB.auth.getSession();
    if (!data.session) {
      AUTH.ready = true; route();
      const hh = location.hash || "";
      if (/error_description=/.test(hh)) { const m = decodeURIComponent((hh.match(/error_description=([^&]+)/) || [])[1] || "").replace(/\+/g, " "); $("#lEmailMsg") && ($("#lEmailMsg").innerHTML = `<p class="msg bad">Link masuk tidak berlaku (${esc(m)}). Minta link baru.</p>`); }
      let p = ""; try { p = sessionStorage.getItem("pesan_login") || ""; sessionStorage.removeItem("pesan_login"); } catch (e) {}
      if (p) { const b = $("#lEmailMsg") || $("#lPinMsg"); if (b) b.innerHTML = `<p class="msg bad">${esc(p)}</p>`; }
      return;
    }
  }
  await mulaiSesi();
}
init();
