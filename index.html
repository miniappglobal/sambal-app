input[type=color]{display:block;width:100%;height:44px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px;cursor:pointer}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55}

<div id="app" class="wrap"><p class="muted">Memuat…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===================== KONFIGURASI TAHAP =====================
const STAGES = {
  bersih: {
    label: "Pembersihan & Pengurusan Bahan Baku", short: "Bersih", prev: null, canCreate: false,
    // Perbandingan: 10.000 g bawang merah : 2.500 g cabe rawit : 300 g daun jeruk (rasio per 1 g bawang merah untuk cabe, dan per 1 kg untuk daun jeruk)
    ingredients: [
      {k: "bm", nama: "Bawang merah (bahan utama)", unit: "g", rasio: null},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: 0.25},
      {k: "dj", nama: "Daun jeruk", unit: "g", rasio: 30}
    ],
    verb: "dibersihkan", target: true,
    checks: []
  },
  rajang: {
    label: "Perajangan", short: "Rajang", prev: "bersih", canCreate: false,
    ingredients: [
      {k: "bm", nama: "Bawang merah (bahan utama)", unit: "g", rasio: null},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: null}
    ],
    // Tidak dirajang: beratnya diteruskan apa adanya dari tahap sebelumnya
    passthru: [{k: "dj", nama: "Daun jeruk", unit: "g"}],
    verb: "dirajang",
    checks: []
  },
  goreng: {
    label: "Penggorengan & Seasoning", short: "Goreng", prev: "rajang", canCreate: false,
    fields: [["berat_masuk", "Berat bahan masuk penggorengan (g)"], ["berat_goreng", "Berat setelah digoreng, sebelum seasoning (g)"], ["seasoning_g", "Bubuk seasoning dipakai (g) · otomatis"], ["paket_seasoning", "Paket seasoning disiapkan · otomatis"], ["berat_keluar", "Berat hasil setelah seasoning & dingin (g)"]],
    // 1 paket = 180 g bubuk campuran; dipakai 75 g per 1 kg bahan yang sudah digoreng
    seasoning: {perKg: 75, paketG: 180}, // angka bawaan; isi paket hanya disimpan di master data (khusus pemilik)
    checks: []
  },
  kemas: {
    label: "Pengemasan, QC, Labeling & Batch", short: "Kemas", prev: "goreng", canCreate: false,
    fields: [["berat_masuk", "Berat sambal siap kemas (g)"], ["jumlah_botol", "Jumlah botol · otomatis (dibulatkan ke bawah per 50 g)"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Botol reject (pcs)"]],
    perBotol: 50, perKardus: 20,
    checks: ["Tutup botol rapat, tidak bocor", "Isi per botol 50 g (cek timbang acak)", "Label & kode batch tercetak jelas", "Tanggal kedaluwarsa tercantum", "Tidak ada benda asing / warna menyimpang"],
    photo: true
  }
};
const ORDER = ["bersih", "rajang", "goreng", "kemas"];
Object.values(STAGES).forEach(C => { if (C.ingredients) C.fields = C.ingredients.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + C.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + C.verb + " (" + g.unit + ")"]]); });

// ===================== KONFIGURASI SAMBAL BASAH =====================
// Tahap basah memakai koleksi yang sama dengan tahap kering (posisi tahap sama), dibedakan oleh awalan nomor batch SB.
const STAGES_B = {
  bersih: {
    label: "Pembersihan bahan & topping", short: "Bersih", prev: null, canCreate: false, target: true,
    ingredients: [
      {k: "bm", nama: "Bawang merah", unit: "g", rasio: null},
      {k: "cb", nama: "Cabe besar", unit: "g", rasio: 1},
      {k: "cr", nama: "Cabe rawit", unit: "g", rasio: 1},
      {k: "dj", nama: "Daun jeruk", unit: "g", rasio: 0.01}
    ],
    verb: "dibersihkan", checks: []
  },
  rajang: {
    label: "Penghalusan & pemasakan sampai 75%", short: "Halus", prev: "bersih",
    fields: [["berat_masuk", "Berat masuk (g) · otomatis dari tahap 1"], ["minyak_g", "Minyak goreng dipakai (g) · saran 1.800 g (2 liter) per 1 kg bawang merah"], ["berat_keluar", "Berat setelah dihaluskan dan dimasak 75% (g)"]],
    checks: []
  },
  goreng: {
    label: "Mixing topping & pemasakan sampai 100%", short: "Mix", prev: "rajang",
    fields: [["berat_masuk", "Berat masuk (g) · otomatis dari tahap 2"], ["topping_g", "Topping ditambahkan saat mixing (g) · saran 500 g per 1 kg hasil tahap 2 (teri 250 g)"], ["berat_keluar", "Berat setelah mixing dan dimasak 100% (g)"]],
    checks: []
  },
  kemas: {
    label: "Pengemasan, labeling & QC", short: "Kemas", prev: "goreng", canCreate: false,
    fields: [["berat_masuk", "Berat sambal siap kemas (g)"], ["jumlah_botol", "Jumlah botol · otomatis (dibulatkan ke bawah per 150 g)"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Botol reject (pcs)"]],
    perBotol: 150, perKardus: 20,
    checks: ["Tutup botol rapat, tidak bocor", "Isi per botol 150 g (cek timbang acak)", "Label & kode batch tercetak jelas", "Tanggal kedaluwarsa tercantum", "Tidak ada benda asing / warna menyimpang"],
    photo: true
  }
};
Object.values(STAGES_B).forEach(C => { if (C.ingredients) C.fields = C.ingredients.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + C.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + C.verb + " (" + g.unit + ")"]]); });
const jenisOf = id => (B[id] && B[id].jenis) === "basah" ? "basah" : "kering";
const VAR_LABEL = {cumi: "Cumi", tongkol: "Tongkol / tuna suwir", ayam: "Ayam suwir", udang: "Udang", teri: "Teri kering", polos: "Sambal bawang"};
// Varian yang dipilih di order (boleh lebih dari satu). Sisa sambal setelah porsi topping = sambal bawang.
const varsOf = id => (B[id] && Array.isArray(B[id].varians)) ? B[id].varians : (B[id] && B[id].varian && B[id].varian !== "polos" ? [B[id].varian] : []);
// Topping per 1 g sambal: cumi/tongkol/ayam/udang 500 g per 1000 g, teri 250 g per 1000 g
// Rasio topping : sambal. Kalau ada "sambal untuk 1.000 g topping <varian>" dipakai itu; kalau kosong pakai rasio umum.
// Pekerja tidak bisa membaca takaran/harga, jadi rasio juga disalin ke takaran/rasio_pakai (boleh dibaca pekerja).
const RASIO_KEYS = ["sb_topping_g_per_kg", "sb_teri_g_per_kg", "sb_sambal_per_kg_cumi", "sb_sambal_per_kg_tongkol", "sb_sambal_per_kg_ayam", "sb_sambal_per_kg_udang", "sb_sambal_per_kg_teri", "sb_minyak_g"];
const rasioPakai = H => Object.fromEntries(RASIO_KEYS.map(k => [k, H[k] ?? null]));
const topRatio = v => { const H = TK.harga || TK.rasio_pakai || {}, s = Number(H["sb_sambal_per_kg_" + v]); if (s > 0) return 1000 / s;
  return (v === "teri" ? (Number(H.sb_teri_g_per_kg) || 250) : (Number(H.sb_topping_g_per_kg) || 500)) / 1000; };
function cfgBasah(id, v) {
  const base = STAGES_B[v], vs = varsOf(id);
  if (v === "bersih") {
    const ing = base.ingredients.concat(vs.map(x => ({k: "tp_" + x, nama: "Topping " + VAR_LABEL[x], unit: "g", rasio: null, topping: true})));
    return {...base, ingredients: ing, fields: ing.flatMap(g => [[g.k + "_masuk", g.nama + " sebelum " + base.verb + " (" + g.unit + ")"], [g.k + "_bersih", g.nama + " sesudah " + base.verb + (g.topping ? " · siap mixing" : "") + " (" + g.unit + ")"]])};
  }
  if (v === "goreng") return {...base, fields: [["berat_masuk", base.fields[0][1]], ...vs.flatMap(x => [["topping_" + x + "_g", "Topping " + VAR_LABEL[x] + " siap mixing (g) · dari tahap 1"], ["sambal_" + x + "_g", "Sambal " + VAR_LABEL[x] + " dimasukkan (g) · otomatis dari topping"], ["mix_" + x + "_g", "Berat setelah mixing " + VAR_LABEL[x] + " (g) · ditimbang"]]), ["sisa_g", "Sambal bawang tanpa topping (g) · otomatis = sisa"], ["berat_keluar", "Total berat setelah mixing (g) · otomatis"]]};
  if (v === "kemas") return {...base, fields: [["berat_masuk", base.fields[0][1]], ...vs.concat("polos").flatMap(x => [["botol_" + x, "Botol " + VAR_LABEL[x] + " · otomatis (per 150 g dari berat mixing)"], ["reject_" + x, "Reject " + VAR_LABEL[x] + " (pcs)"]]), ["jumlah_botol", "Jumlah botol total · otomatis"], ["jumlah_label", "Jumlah label · otomatis (sama dengan jumlah botol)"], ["reject", "Total reject · otomatis"]]};
  return base;
}
const cfgOf = (id, v = view) => (id && jenisOf(id) === "basah" ? cfgBasah(id, v) : STAGES[v]);
// Tahap 3 basah: topping siap mixing dari tahap 1; sambal = topping ÷ rasio; sisa = hasil tahap 2 − semua sambal.
// Setiap varian ditimbang sendiri setelah mixing; total = jumlah timbangan varian + sambal bawang.
function updMix() {
  if (!sel || view !== "goreng" || jenisOf(sel) !== "basah") return;
  const masuk = num($("#f_berat_masuk").value) || 0, P = R.bersih[sel] || {};
  let total = 0, mixSum = 0;
  varsOf(sel).forEach(v => {
    const t = P["tp_" + v + "_bersih"] ?? null, tEl = $("#f_topping_" + v + "_g"), sEl = $("#f_sambal_" + v + "_g");
    tEl.value = t ?? ""; tEl.readOnly = true;
    const sb = t == null ? null : Math.round(t / topRatio(v));
    sEl.value = sb ?? ""; sEl.readOnly = true;
    total += sb || 0;
    mixSum += num($("#f_mix_" + v + "_g").value) || 0;
  });
  const sisa = $("#f_sisa_g"); sisa.value = masuk ? Math.max(0, Math.round(masuk - total)) : ""; sisa.readOnly = true;

async function createBatch() {

function writeErr(e) {
  if (e && e.code === "tidak_boleh") return "Anda tidak punya izin menyimpan di tahap ini. Minta pemilik mengatur tahap Anda.";
  if (e && e.code === "offline") return "Tidak ada sinyal. Data belum tersimpan, coba pencet lagi setelah sinyal kembali.";
  if (e && (e.code === "sesi_habis" || e.code === "belum_login")) return "Sesi berakhir. Silakan masuk lagi.";
  if (e && e.code === "masa_aktif_habis") return "Masa aktif aplikasi habis. Hubungi penjual untuk memperpanjang.";
  if (e && e.code === "quota_exceeded") return "Penyimpanan penuh. Hubungi pemilik.";
  return "Gagal menyimpan (" + (e && (e.code || e.message)) + "). Periksa sinyal lalu coba lagi.";
}

// ---------- Riwayat harga: harga baru hanya berlaku untuk batch yang dibuat SETELAH harga disimpan ----------
// takaran/harga_riwayat = {v: [{dari: ISO, h: {...harga}}]} urut dari lama ke baru.

function versiHarga(id) {

// ---------- HPP sambal basah: biaya batch dibagi per varian ----------
const BUMBU_BASAH = {"Terasi": "sb_terasi_g", "Masako sapi": "sb_masako_g", "Garam": "sb_garam_g", "Micin": "sb_micin_g", "Gula pasir": "sb_gula_g"};
// Keterangan di daftar harga bumbu: dipakai produk mana
function pakaiBumbu(nm) {
  const l = String(nm).toLowerCase(), k = seasonCfg().paket.some(p => String(p[0]).toLowerCase() === l), b = Object.keys(BUMBU_BASAH).some(x => x.toLowerCase() === l);
  return k && b ? "dipakai sambal kering & basah" : k ? "khusus sambal kering" : b ? "khusus sambal basah" : "belum dipakai";
}
function hppBasah(id) {
  const H = hargaUntuk(id); if (!H || jenisOf(id) !== "basah" || !B[id]) return null;
  const n = k => Number(H[k]) || 0;
  const bb = nm => (H.bumbu || []).find(x => String(x.nama).trim().toLowerCase() === nm.toLowerCase()) || {};
  const bmR = R.bersih[id] || {}, gR = R.goreng[id] || {}, kR = R.kemas[id] || {};
  const bmKg = (bmR.bm_masuk ?? (B[id].order || {}).bm_kg ?? 0) / 1000;
  const vs = varsOf(id), all = vs.concat("polos");
  // Biaya bersama batch: bahan utama, minyak, bumbu (termasuk masako), gas, listrik, upah, biaya lain
  const bahan = (bmR.bm_masuk || 0) / 1000 * n("bm_kg") + (bmR.cb_masuk || 0) / 1000 * n("sb_cabe_besar_kg") + (bmR.cr_masuk || 0) / 1000 * n("cr_kg") + (bmR.dj_masuk || 0) / 1000 * n("dj_kg");
  // Minyak: pakai berat yang ditimbang di tahap 2 (gram) bila ada; kalau belum, perkiraan liter per kg bawang merah
  const minyakG = (R.rajang[id] || {}).minyak_g;
  const minyak = minyakG != null && n("minyak_isi_g") ? minyakG * n("minyak_harga") / n("minyak_isi_g") : (n("minyak_isi_g") ? bmKg * n("sb_minyak_g") * n("minyak_harga") / n("minyak_isi_g") : 0);
  let bumbu = 0;
  Object.keys(BUMBU_BASAH).forEach(nm => { const b = bb(nm); if (b.harga && b.isi_g) bumbu += bmKg * n(BUMBU_BASAH[nm]) * b.harga / b.isi_g; });
  const gas = n("gas_harga") / (n("sb_gas_per_tabung") || 1);
  const listrik = n("sb_blender_w") * n("sb_blender_menit") / 60000 * n("listrik_kwh");
  const upah = n("upah_harian") * n("jumlah_pekerja") * (upahShare(id) ?? 1);
  const S = bahan + minyak + bumbu + gas + listrik + upah + n("lain_per_batch");
  // Pembagian biaya bersama mengikuti berat setelah mixing tiap varian (sambal bawang = sisa)
  const berat = {}; vs.forEach(v => berat[v] = gR["mix_" + v + "_g"] || 0); berat.polos = gR.sisa_g || 0;
  const W = Object.values(berat).reduce((a, b) => a + b, 0);
  const varian = {};
  all.forEach(v => {
    const f = W ? berat[v] / W : 1 / all.length;
    // Topping dan kemasan dihitung langsung untuk varian itu
    const topping = v === "polos" ? 0 : (bmR["tp_" + v + "_bersih"] || 0) / 1000 * n("sb_topping_" + v + "_kg");
    const botol = kR["botol_" + v] || 0, reject = kR["reject_" + v] || 0, good = Math.max(0, botol - reject);
    const kemasan = botol * n("kemasan_per_botol"), kardus = Math.ceil(botol / 20) * n("kardus_harga");
    const total = S * f + topping + kemasan + kardus;
    varian[v] = {nama: PRODUK_LABEL[v], botol, reject, good, total, hpp: good ? total / good : null};
  });
  return {S, varian};
}
// HPP per botol tiap produk basah, dari semua batch yang sudah selesai dikemas
function hppProdukBasah() {
  const agg = {}; Object.keys(PRODUK_LABEL).forEach(k => agg[k] = {total: 0, good: 0});
  Object.keys(B).forEach(id => {
    const h = hppBasah(id); if (!h || !R.kemas[id] || R.kemas[id].status !== "selesai") return;
    Object.keys(h.varian).forEach(v => { const x = h.varian[v]; if (agg[v]) { agg[v].total += x.total; agg[v].good += x.good; } });
  });
  const out = {}; Object.keys(agg).forEach(k => out[k] = agg[k].good ? agg[k].total / agg[k].good : null); return out;
}

// ---------- Stok per produk (kering dan tiap varian basah) ----------
const PRODUK_LABEL = {kering: "Sambal kering (botol 50 g)", cumi: "Sambal basah cumi (botol 150 g)", tongkol: "Sambal basah tongkol (botol 150 g)", ayam: "Sambal basah ayam (botol 150 g)", udang: "Sambal basah udang (botol 150 g)", teri: "Sambal basah teri (botol 150 g)", polos: "Sambal basah bawang tanpa topping (botol 150 g)"};
// Produk satu barang invoice; invoice lama tanpa pilihan produk ditebak dari namanya
function produkDari(it) {
  if (it && it.produk && PRODUK_LABEL[it.produk]) return it.produk;
  const n = String((it && it.nama) || "").toLowerCase();
  if (/cumi/.test(n)) return "cumi";
  if (/tuna|tongkol/.test(n)) return "tongkol";
  if (/ayam/.test(n)) return "ayam";
  if (/udang/.test(n)) return "udang";
  if (/teri/.test(n)) return "teri";
  if (/bawang|polos|tanpa topping/.test(n)) return "polos";
  return "kering";
}
let OPNAME = false;
function stokProduk(tanpaKoreksi) {
  const out = {}, kor = (!tanpaKoreksi && SET.stok && SET.stok.koreksi) || {};
  Object.keys(PRODUK_LABEL).forEach(k => out[k] = {nama: PRODUK_LABEL[k], produksi: 0, reject: 0, terjual: 0, koreksi: Number(kor[k]) || 0, stok: 0});
  Object.keys(R.kemas).forEach(id => {
    const k = R.kemas[id]; if (!k || k.status !== "selesai") return;
    if (jenisOf(id) === "basah") varsOf(id).concat("polos").forEach(v => { out[v].produksi += Number(k["botol_" + v]) || 0; out[v].reject += Number(k["reject_" + v]) || 0; });
    else { out.kering.produksi += Number(k.jumlah_botol) || 0; out.kering.reject += Number(k.reject) || 0; }
  });
  Object.values(J).forEach(v => (v.items || []).forEach(it => { out[produkDari(it)].terjual += Number(it.botol) || 0; }));
  Object.values(out).forEach(o => o.stok = o.produksi - o.reject - o.terjual + o.koreksi);
  return out;
}
// ---------- Kode batch per barang invoice (untuk penarikan produk) ----------
// Batch yang menghasilkan produk itu: kering = batch kering; varian basah = batch basah yang punya varian itu (bawang/polos = semua batch basah).
function batchUntuk(produk) {
  return sortBatch(Object.keys(R.kemas).filter(id => {
    const k = R.kemas[id]; if (!k || k.status !== "selesai" || !B[id]) return false;
    if (produk === "kering") return jenisOf(id) !== "basah";
    return jenisOf(id) === "basah" && (produk === "polos" || varsOf(id).includes(produk));
  }));
}
// Sisa botol satu produk di satu batch = dikemas − reject − botol invoice yang memakai kode batch itu
function sisaBatch(id, produk, kecuali) {
  const k = R.kemas[id] || {};
  const dibuat = produk === "kering" ? (Number(k.jumlah_botol) || 0) - (Number(k.reject) || 0) : (Number(k["botol_" + produk]) || 0) - (Number(k["reject_" + produk]) || 0);
  let keluar = 0;
  Object.values(J).forEach(v => { if (v.no === kecuali) return; (v.items || []).forEach(it => { if (it.batch === id && produkDari(it) === produk) keluar += Number(it.botol) || 0; }); });

}
// Pilihan batch untuk satu barang; default = batch terbaru yang masih ada sisanya
// (invoice lama belum punya kode batch, jadi sisa batch lama bisa terlihat lebih banyak dari kenyataan)
function batchOpsi(produk, pilih, kecuali) {

function seasonCost(H) {

    if (!b || !b.harga || !b.isi_g) { miss.push(nama); return; }

    minyak: n("minyak_isi_g") ? minyakG * n("minyak_harga") / n("minyak_isi_g") : 0,
    gas: k * n("gas_harga") / (n("gas_goreng_per_tabung") || 1),

// Rendemen = total sambal jadi (sesudah seasoning) ÷ total bawang merah mentah, dari batch yang tahap gorengnya selesai
function rendemen() {
  let jadi = 0, bm = 0, n = 0;
  Object.keys(B).forEach(id => { const g = R.goreng[id], b = R.bersih[id]; if (g && g.status === "selesai" && g.berat_keluar && b && b.bm_masuk) { jadi += g.berat_keluar; bm += b.bm_masuk; n++; } });
  if (n && bm) return {r: jadi / bm, n};
  return {r: (TK.harga && Number(TK.harga.rendemen_awal)) || null, n: 0};
}

// Saldo tiap akun: saldo awal + masuk − keluar; pindah dana memindahkan uang dan memotong biaya transfer dari akun asal
function kasSaldoAkun(rows) {

  rows.forEach(r => {

}

function hppRata() {

  let t = 0, n = 0, nb = 0;

    else { level = 2; txt = `Aman · cek lagi ${tglID(next)}${cek ? ` (sisa ${fmt(cek.sisa, 0)} botol saat dicek)` : ""}`; }

}

function invText(v) {
  const U = SET.usaha || {}, pel = v.pel || {};
  const lines = (v.items || []).map(it => `- ${it.nama}: ${fmt(it.botol, 0)} botol x ${rp(it.harga)} = ${rp(it.botol * it.harga)}`);

  if (v.diskon) out.push(`Diskon: -${rp(v.diskon)}`);
  if (v.ongkir) out.push(`Ongkos kirim: ${rp(v.ongkir)}`);
  out.push(`*Total: ${rp(v.total)}*`, `Status: ${v.status === "lunas" ? "LUNAS" : "Belum lunas"}`);
  if (U.rekening) out.push("", "Pembayaran:", U.rekening);
  out.push("", "File PDF invoice terlampir. Terima kasih.");
  return out.filter((l, i) => !(l === "" && i === 1)).join("\n");
}
async function invPanelClick(e) {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const v = J[invOpen]; if (!v) return;
  const a = b.dataset.act;
  if (a === "tutup") { invOpen = null; invDel = null; refInv(); return; }
  if (a === "batch") {
    const items = (v.items || []).map((it, i) => ({...it, produk: produkDari(it), batch: ($("#ivb_" + i) || {}).value || null}));
    try { await DB.doc("penjualan/" + v.no).update({items}); say("Kode batch tersimpan."); } catch (err) { say(writeErr(err), true); }
    return;
  }
  if (a === "pdf") { b.disabled = true; await savePdf(v); b.disabled = false; return; }
  if (a === "pdfwa") { b.disabled = true; await savePdf(v, {wa: true}); b.disabled = false; return; }
  if (a === "status") { try { await DB.doc("penjualan/" + v.no).update({status: v.status === "lunas" ? "belum" : "lunas", lunasAt: v.status === "lunas" ? null : todayStr(), bayarVia: v.status === "lunas" ? null : (($("#ivViaDet") || {}).value || "tunai")}); say("Status pembayaran diperbarui."); } catch (err) { say(writeErr(err), true); } return; }
  if (a === "del") {
    if (invDel !== v.no) { invDel = v.no; refInv(); return; }
    try { await DB.doc("penjualan/" + v.no).delete(); invOpen = null; invDel = null; say(`Invoice ${v.no} dihapus.`); } catch (err) { say(writeErr(err), true); }
  }
}
// Kirim PDF lewat menu berbagi HP (WhatsApp bisa dipilih di sana). Cadangan: simpan PDF lalu buka WA dengan teks.
async function kirimPdfWA(v, blob, fname) {
  const pel = v.pel || {}, teks = invText(v);
  const file = new File([blob], fname, {type: "application/pdf"});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: v.no, text: teks}); say("Pilih WhatsApp di menu berbagi, lalu pilih kontak pelanggan."); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await DL.save({filename: fname, data: blob}); } catch (e) {}

async function savePdf(v, opts) {

  y += 5;

  doc.setFont("helvetica", "normal"); doc.setFontSize(17); doc.setTextColor(51, 57, 59); t("I N V O I C E", PW / 2, y + 7.2, {align: "center"});
  y += 16;
  // Dua kotak: tagihan kepada (kiri) dan data invoice (kanan)

  doc.setFont("helvetica", "bold"); warna(GELAP); t("TAGIHAN KEPADA", xL + 3, top + 4.8);
  let yk = top + 12;
  doc.setFontSize(9.5); namaL.forEach(line => { t(line, xL + 3, yk); yk += 4.5; });
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); warna(ABU);
  if (pel.telp) { t(pel.telp, xL + 3, yk); yk += 4; }
  alamatL.forEach(line => { t(line, xL + 3, yk); yk += 4; });

  baris("No. invoice", v.no, top + 6); baris("Tanggal", tglID(v.tgl), top + 12); baris("Status", lunas ? "LUNAS" : "BELUM LUNAS", top + 18, lunas ? [45, 122, 75] : [179, 38, 30]);
  doc.setFillColor(...MUDA); doc.rect(xR, top + H - 8, bw, 8, "F"); doc.rect(xR, top, bw, H);
  doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); warna(GELAP); t("TOTAL", xR + 3, top + H - 2.6); t(rp(v.total), xR + bw - 3, top + H - 2.6, {align: "right"});
  y = top + H + 9;
  // Tabel barang

  t("Barang", L + 1, y); t("Botol", 86, y, {align: "right"}); t("Dus", 99, y, {align: "right"}); t("Harga", 117, y, {align: "right"}); t("Jumlah", Rx - 1, y, {align: "right"});
  doc.setFont("helvetica", "normal"); y += 7;
  (v.items || []).forEach(it => {

  if (v.catatan) block(v.catatan);
  if (U.catatan_invoice) block(U.catatan_invoice);
  if (opts && opts.wa) return kirimPdfWA(v, doc.output("blob"), `${v.no} ${String(pel.nama || "").replace(/[^\w\s-]/g, "").trim()}.pdf`);

function kecilkanGambar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); // latar putih untuk gambar transparan
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("gambar")); };
    img.src = url;
  });
}

// Penyimpanan dengan bentuk yang sama seperti versi artifact: collection().onSnapshot / doc().get/set/update/delete.
// Data diperbarui otomatis tiap 15 detik (60 detik saat layar tidak aktif) dan langsung setelah menyimpan.
function makeDb() {
  const subs = {};
  let timer = null, pending = null, lastErr = null;
  async function poll() {
    const colls = Object.keys(subs); if (!colls.length || !AUTH.role) return;
    try {
      const j = await api("list", {colls});
      colls.forEach(c => {
        const o = (j.docs || {})[c] || {};
        const docs = Object.keys(o).map(id => ({id, exists: true, data: () => o[id]}));
        subs[c].forEach(cb => cb({docs, size: docs.length, empty: !docs.length}));
      });
      if (lastErr) { lastErr = null; if (msgBad) say("", false); }
    } catch (e) { if (e.code === "offline" && !lastErr) { lastErr = e; say("Tidak ada sinyal. Data akan diperbarui lagi saat sinyal kembali.", true); } }
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(async () => { await poll(); schedule(); }, document.hidden ? 60000 : 15000); }
  function refresh() { if (pending) return; pending = setTimeout(async () => { pending = null; await poll(); schedule(); }, 60); }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  const doc = path => {
    const k = path.indexOf("/"), coll = path.slice(0, k), id = path.slice(k + 1);
    return {
      id, path,
      get: async () => { const j = await api("get", {coll, id}); return {id, exists: !!j.exists, data: () => j.data}; },
      set: async d => { await api("set", {coll, id, data: d}); refresh(); },
      update: async d => { await api("update", {coll, id, data: d}); refresh(); },
      delete: async () => { await api("delete", {coll, id}); refresh(); }
    };
  };
  return {
    doc, refresh,
    collection: c => ({
      onSnapshot: next => { (subs[c] = subs[c] || []).push(next); refresh(); return () => {}; },
      doc: id => doc(c + "/" + (id || rid())),
      add: async d => { const ref = doc(c + "/" + rid()); await ref.set(d); return ref; }
    })
  };
}

    if (e.code === "bukan_pembeli") { try { await SB.auth.signOut(); } catch (x) {} AUTH.ready = true; route(); $("#lEmailMsg") && ($("#lEmailMsg").innerHTML = '<p class="msg bad">Email ini belum terdaftar sebagai pembeli aplikasi.</p>'); return; }
    if (e.code === "masa_aktif_habis") { AUTH.ready = true; route(); say("Masa aktif aplikasi habis.", true); return; }
    if (e.code === "offline") { $("#app").innerHTML = '<h1>Tidak ada sinyal</h1><p class="muted">Sambungkan internet lalu muat ulang halaman.</p>'; return; }
    AUTH.ready = true; route(); return;
  }
  AUTH = {role: w.role, info: w, ready: true};
  terapkanTema(w.usaha && w.usaha.tema); aturFavicon(w.usaha && w.usaha.logo);
  IS_ADMIN = w.role === "owner"; OWNER_KNOWN = true;
  DB = makeDb(); DL = LOCAL_DL;
  const db = DB;
  db.collection("batches").onSnapshot(s => { B = {}; s.docs.forEach(d => B[d.id] = d.data() || {}); ready = true; render(); });
  ORDER.forEach(k => db.collection(k).onSnapshot(s => { R[k] = {}; s.docs.forEach(d => R[k][d.id] = d.data() || {}); render(); }));
  db.collection("takaran").onSnapshot(s => { TK = {}; s.docs.forEach(d => TK[d.id] = d.data() || {}); render(); });
  if (IS_ADMIN) {
    db.collection("pelanggan").onSnapshot(s => { P = {}; s.docs.forEach(d => P[d.id] = d.data() || {}); if (view === "penjualan" && stab === "baru" && $("#ivPel") && !$("#ivPel").options.length) $("#sbody").dataset.tab = ""; render(); });
    db.collection("penjualan").onSnapshot(s => { J = {}; s.docs.forEach(d => J[d.id] = d.data() || {}); render(); });
    db.collection("kas").onSnapshot(s => { KAS = {}; s.docs.forEach(d => KAS[d.id] = d.data() || {}); render(); });
    db.collection("setting").onSnapshot(s => { SET = {}; s.docs.forEach(d => SET[d.id] = d.data() || {}); if (TEMA_BARU === undefined) { terapkanTema(temaUsaha()); aturFavicon((SET.usaha || {}).logo); } if (view === "penjualan" && stab === "atur" && $("#sbody") && !$("#sbody").contains(document.activeElement)) $("#sbody").dataset.tab = ""; render(); });
  }
  let tujuan = ""; try { tujuan = sessionStorage.getItem("tujuan") || ""; sessionStorage.removeItem("tujuan"); } catch (e) {}
  const h = (location.hash || "").replace("#", "");
  if ((!h || h.includes("access_token")) && tujuan) { history.replaceState(null, "", location.pathname + location.search + "#" + tujuan); }
  else if (h.includes("access_token") || h.includes("error=")) history.replaceState(null, "", location.pathname + location.search + (IS_ADMIN ? "#master" : ""));
  route();
}
async function init() {
  route();
  if (!window.supabase) { $("#app").innerHTML = '<h1>Gagal memuat aplikasi</h1><p class="muted">Periksa sinyal internet lalu muat ulang halaman.</p>'; return; }
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit"}});
  try { SESI = localStorage.getItem("sm_sesi") || null; } catch (e) {}
  if (!SESI) {
    const {data} = await SB.auth.getSession();
    if (!data.session) {
      AUTH.ready = true; route();
      const hh = location.hash || "";
      if (/error_description=/.test(hh)) { const m = decodeURIComponent((hh.match(/error_description=([^&]+)/) || [])[1] || "").replace(/\+/g, " "); $("#lEmailMsg") && ($("#lEmailMsg").innerHTML = `<p class="msg bad">Link masuk tidak berlaku (${esc(m)}). Minta link baru.</p>`); }
      let p = ""; try { p = sessionStorage.getItem("pesan_login") || ""; sessionStorage.removeItem("pesan_login"); } catch (e) {}
      if (p) { const b = $("#lEmailMsg") || $("#lPinMsg"); if (b) b.innerHTML = `<p class="msg bad">${esc(p)}</p>`; }
      return;
    }
  }
  await mulaiSesi();
}
init();

</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
